<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Viewer</title>
    <script>
        // Wait for the loadFileSystem message
        window.addEventListener('message', async (event) => {
            if (event.data.type === 'SET_FILESYSTEM') {
                const fileSystem = event.data.filesystem;
                
                // Register service worker
                if ('serviceWorker' in navigator) {
                    const registration = await navigator.serviceWorker.register('/service-worker.js');
                    console.log('ServiceWorker registration successful');
                    
                    // Send filesystem data to service worker
                    registration.active?.postMessage({
                        type: 'SET_FILESYSTEM',
                        filesystem: fileSystem
                    });
                }
            }
        });
    </script>
</head>
<body>
    <iframe id="projectFrame" src="/project/index.html" style="width: 100%; height: 100vh; border: none;"></iframe>
</body>
</html>
